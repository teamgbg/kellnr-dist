# sha256 b64c562b0fa9393574c31e6df85072d9af7288a8628801231d406aa68f8344f0).
# binstall reads pkg-url + disabled-strategies from THIS manifest
# (--manifest-path), which skips crates.io discovery entirely.

[package]
name = "kellnr"
version = "6.6.0"
edition = "2021"
description = "Private Cargo crate registry (vendored prebuilt delivery manifest)"
